# Publishes a release when a v* tag is pushed: test, build, checksum, sign,
# attest, then install the published release on Linux and macOS with
# signature verification required. See docs/releasing.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -race ./...
      - run: go test -tags integration ./tests/integration/

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # keyless cosign signing (Sigstore)
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the changelog
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

  verify-install:
    needs: release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: install the published release, signature required
        env:
          ORCA_VERSION: ${{ github.ref_name }}
          ORCA_INSTALL_DIR: ${{ runner.temp }}/bin
          ORCA_REQUIRE_SIGNATURE: "1"
        run: |
          sh ./install.sh
          "$ORCA_INSTALL_DIR/orca" version | grep -F "orca ${ORCA_VERSION#v} "
      - name: run against Docker (Linux runner only)
        if: runner.os == 'Linux'
        run: '"$RUNNER_TEMP/bin/orca" report --summary'
