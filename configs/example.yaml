# Orca configuration.
#
# Location: --config <file>, else $XDG_CONFIG_HOME/orca/config.yaml
# (default ~/.config/orca/config.yaml). With sudo, $HOME is root's, so pass
# --config explicitly. Every key is optional; omitted keys keep the defaults
# shown here. A list that is present replaces the default list. Unknown keys
# are an error.

# Disk pressure levels for the filesystem holding Docker's data root, as a
# used percentage computed like df(1).
disk:
  warning: 70%
  critical: 85%
  emergency: 95%

logs:
  # Container logs at least this large are reported as large (decimal units).
  large_threshold: 100MB

# Volume protection. A protected volume is never a GC candidate.
volumes:
  # Protect volumes mounted in a container at, or stored on the host at, a
  # path under one of these directories.
  protected_paths:
    - /var/lib/postgresql
    - /var/lib/mysql
  # Protect volumes whose name matches one of these glob patterns.
  protected_patterns:
    - "*_production"
    - "*_backup"
  # Protect every volume of these projects (com.orca.project label, or the
  # Docker Compose project name).
  protected_projects: []

# Garbage-collection planner (orca plan). Nothing is ever deleted by a plan.
gc:
  # Policy roots: resources they keep are never candidates. "0" or [] turns
  # a policy root off.
  stopped_container_retention: 7d  # keep stopped containers used within this window
  protected_tags:                  # keep images whose repository:tag matches
    - "*:latest"                   # (* matches any characters, including "/")
  project_retention: true          # keep projects whose com.orca.retention has not elapsed
  build_cache_retention: 7d        # keep build cache used within this window
  # Unreachable resources go to REVIEW instead of SAFE when:
  review:
    recent: 24h                    # created or used within this window
    large: 10GB                    # they would free at least this much
  # Ranking only; a score never changes a classification.
  weights:
    reclaim: 0.5
    age: 0.3
    activity: 0.2
    ambiguity: 0.3

# Named Docker daemons, used with --host <name> (none by default). See
# docs/remote.md.
# hosts:
#   prod:
#     url: ssh://admin@prod.example.com      # runs `docker system dial-stdio` over ssh
#   build:
#     url: tcp://build.example.com:2376
#     tls_cert_path: ~/.docker/build          # ca.pem, cert.pem, key.pem
#   local:
#     url: unix:///var/run/docker.sock
